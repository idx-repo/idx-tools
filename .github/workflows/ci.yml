name: CI

on:
  push:
    branches: [ "idx", "main", "master" ]
  pull_request:
    branches: [ "idx", "main", "master" ]
  workflow_dispatch:

jobs:
  test:
    name: Lint & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck

      - name: Lint Shell Scripts (ShellCheck)
        run: |
          shellcheck -x -e SC1091 Bash/*.sh tests/*.sh install.sh remove.sh

      - name: Lint & Syntax Check (make lint)
        run: make lint

      - name: Run Test Suite (make test)
        run: make test

      - name: Test Fresh Installation Lifecycle
        run: |
          TEST_HOME=$(mktemp -d)
          export HOME="$TEST_HOME"
          export PATH="$HOME/bin:$PATH"
          mkdir -p "$HOME/bin" "$HOME/.idx-data"

          # Mock network dependencies
          echo '#!/bin/sh' > "$HOME/bin/idx-deps" && chmod +x "$HOME/bin/idx-deps"
          echo '#!/bin/sh' > "$HOME/bin/idxdata-update" && chmod +x "$HOME/bin/idxdata-update"

          # Run installer
          sh install.sh

          # Verify symlinks created
          test -L "$HOME/bin/idxDaily"
          test -L "$HOME/bin/idxindex-update"
          test -L "$HOME/bin/csvdata-update"
          test -L "$HOME/bin/idx30data-update"

          # Run uninstaller
          sh remove.sh

          # Verify symlinks removed
          ! test -L "$HOME/bin/idxDaily"
          ! test -L "$HOME/bin/idxindex-update"
          ! test -L "$HOME/bin/csvdata-update"
          ! test -L "$HOME/bin/idx30data-update"
